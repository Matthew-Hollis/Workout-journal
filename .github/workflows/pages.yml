name: Publish GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# The app token used to push cannot call the Pages API (it lacks pages=write).
# This workflow's GITHUB_TOKEN requests that permission and turns Pages on
# from the default branch root. If that call is rejected, deploy the same
# root files with the Pages actions instead.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enable-branch-pages:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.legacy.outputs.ready }}
    steps:
      - id: legacy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          repo="$GITHUB_REPOSITORY"
          body=$(mktemp)
          err=$(mktemp)
          gh api "repos/${repo}/pages" >"$body" 2>"$err"
          if [ $? -eq 0 ]; then
            echo "Pages site already exists:"
            cat "$body"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            gh api --method POST "repos/${repo}/pages/builds" >"$body" 2>"$err"
            echo "Request build exit $?"
            cat "$body" "$err"
            exit 0
          fi
          echo "GET /pages did not return a site:"
          cat "$err"
          gh api --method POST "repos/${repo}/pages" --input - >"$body" 2>"$err" <<'JSON'
          {
            "build_type": "legacy",
            "source": {
              "branch": "main",
              "path": "/"
            }
          }
          JSON
          post_status=$?
          echo "POST /pages exit ${post_status}"
          cat "$body"
          cat "$err"
          if [ $post_status -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq 'already exists|"status": "409"' "$err"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Branch-root Pages API was rejected. Falling back to an Actions deployment."
          exit 0

  deploy-with-actions:
    needs: enable-branch-pages
    if: needs.enable-branch-pages.outputs.ready != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
