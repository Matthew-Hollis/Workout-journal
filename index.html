<style>

b{font-weight:600;font-variant-numeric:tabular-nums}

.tt{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}.ts{font-size:20px;font-weight:600;letter-spacing:-.02em;color:#f0e2c4;font-variant-numeric:tabular-nums;margin-top:auto}.tsub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.stile{margin:0}.stile .stat{font-size:28px;margin:4px 0}.unit{font-size:15px;color:var(--muted);font-weight:600}
button.card.tap{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:14px;margin-bottom:8px}
button.card.tap:focus-visible{outline:2px solid var(--tan)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.pre{white-space:pre-wrap;margin:0}
.aitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0}.aitem+.aitem{border-top:1px solid var(--line)}
.ck{width:34px!important;min-width:34px;height:34px;min-height:34px!important;padding:0!important;border-radius:11px!important;background:rgba(8,9,7,.55)!important;border:1.5px solid rgba(244,240,232,.28)!important;color:transparent!important;display:grid;place-items:center;flex:none}
.ck svg{width:18px;height:18px}.ck.on{background:var(--green)!important;border-color:#8a9a58!important;color:#f4f0e8!important}
.abody{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:6px}.atext{font-weight:600;line-height:1.35}.ameta{display:flex;flex-wrap:wrap;gap:6px}.ameta:empty{display:none}
.isdone .atext,.donet{text-decoration:line-through;color:var(--muted)}.chip.od{border-color:rgba(224,154,144,.6);color:var(--red)}.chip.cdone{color:#b9c78f}
.dup{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(8,9,7,.5);border:1px solid var(--line)}
.d4row{display:flex;gap:10px;align-items:center}.d4row input{flex:1}.d4.isdone input{text-decoration:line-through;color:var(--muted)}
.seg.small{margin-top:10px}.seg.small button{min-height:38px;padding:6px 10px;font-size:13px}
.daynav{display:flex;align-items:center;gap:10px}button.ic{width:44px;min-width:44px;min-height:44px;padding:0;display:grid;place-items:center}button.ic svg{width:20px;height:20px}button:disabled{opacity:.35}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:12px}.dots span{aspect-ratio:1;border-radius:6px;background:rgba(244,240,232,.07)}.dots span.on{background:#8a9a58}
.prog{height:10px;border-radius:999px;background:rgba(244,240,232,.08);overflow:hidden;margin-top:4px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#8a9a58)}
label.tog.plan{margin:0;padding:8px 0;font-weight:500;font-size:15px}label.tog.plan+label.tog.plan{border-top:1px solid var(--line)}
svg.bars{width:100%;height:auto;display:block}svg.bars text{fill:#c8bba6;font:11px var(--sans);font-variant-numeric:tabular-nums}svg.bars text.mx{fill:#f4f0e8}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>

<ellipse cx="450" cy="150" rx="140" ry="56" fill="#1a2218" opacity=".8" transform="rotate(20 450 150)"/>
<ellipse cx="140" cy="260" rx="120" ry="48" fill="#322c24" opacity=".4" transform="rotate(-12 140 260)"/>
<ellipse cx="340" cy="300" rx="150" ry="54" fill="#1c2418" opacity=".55" transform="rotate(8 340 300)"/>

<rect width="100%" height="100%" fill="url(#mc)"/>
</svg>
<div id="veil" aria-hidden="true"></div>
<header><div class="hrow"><div><p class="brand" id="brand">Personal OS</p><h1 id="ttl">Home</h1></div><button id="sync" class="loading" onclick="goAcct()" aria-live="polite"><i></i><span>Local</span></button></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script src="sync.js"></script>
<script src="os.js"></script>
<script>
const K='wj-data-v1';let D=JSON.parse(localStorage.getItem(K)||'null')||{sessions:[],library:[
{n:'Walk',k:'cardio'},{n:'Stationary Bike',k:'cardio'},{n:'Goblet Squat',k:'strength'},{n:'Leg Press',k:'strength'},{n:'Chest Press',k:'strength'},{n:'Lat Pulldown',k:'strength'},{n:'Seated Row',k:'strength'},{n:'Dumbbell Shoulder Press',k:'strength'},{n:'Plank',k:'cardio'}],weights:[]};
const save=()=>{localStorage.setItem(K,JSON.stringify(D));window.POS&&POS.schedule('workout')};
const tomb=(kind,key)=>{D._del=D._del||{s:{},w:{},l:{}};(D._del[kind]=D._del[kind]||{})[key]=Date.now()};const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const tabs=[['log','Log'],['hist','History'],['lib','Exercises'],['prog','Progress'],['wt','Weight'],['more','Backup']];
const I={
log:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>',
hist:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.25" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M12 8.5V12l2.4 1.8" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>',
lib:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9.5v5M17 9.5v5M4 11v2.2M20 11v2.2M7 12h10" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>',
prog:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16.5V11M10 16.5V7.5M15 16.5v-4M20 16.5V5.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>',
wt:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v15M8.5 7h7M8 17.5h8" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><rect x="5" y="9" width="3" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="16" y="9" width="3" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
more:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h10M7 12h10M7 16h6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>'
};
const X='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>';
let tab='log',cur=null,editId=null,pickQ='',pickBeg=true;
let CATALOG={categories:['Chest','Back','Shoulders','Arms','Legs','Core','Cardio','Mobility'],exercises:[]};
function nav(){OS.nav()}
function go(t){OS.show('workout',t)}
const isC=n=>(D.library.find(e=>e.n==n)||{}).k=='cardio';
function blank(){return{id:Date.now(),date:today(),type:'strength',ex:[],notes:'',feel:3}}
const R={};
R.log=()=>{cur=cur||blank();const s=cur;$('#app').innerHTML=`
<div class="card"><div class="row"><div><label for="wdate">Date</label><input id="wdate" type="date" value="${s.date}" onchange="cur.date=this.value"></div>
<div><label for="wtype">Type</label><select id="wtype" onchange="cur.type=this.value">${['strength','cardio','walk','mixed','other'].map(t=>`<option ${t==s.type?'selected':''}>${t}</option>`).join('')}</select></div></div></div>
<div class="card"><h3>Add exercise</h3>
<label for="exq">Search</label><input id="exq" placeholder="Search name or equipment" autocomplete="off" value="${esc(pickQ)}" oninput="pickQ=this.value;fillPicker()">
<label class="tog" for="exbeg">Beginner-friendly only<input id="exbeg" type="checkbox" ${pickBeg?'checked':''} onchange="pickBeg=this.checked;fillPicker()"></label>
<label for="expick">Exercise</label><select id="expick" onchange="pickEx()"></select>
<p class="m" id="excount" style="margin-top:8px"></p></div>
${s.ex.map((e,i)=>`<div class="card"><div class="exhead"><h3>${esc(e.n)}</h3><button class="x" onclick="cur.ex.splice(${i},1);R.log()">Remove</button></div>
${e.sets.map((t,j)=>`<div class="set"><span class="setn">Set ${j+1}</span><label class="fld"><span>${e.c?'Minutes':'Reps'}</span><input inputmode="decimal" value="${t.a??''}" oninput="cur.ex[${i}].sets[${j}].a=this.value"></label><label class="fld"><span>${e.c?'Miles':'Weight lb'}</span><input inputmode="decimal" value="${t.b??''}" oninput="cur.ex[${i}].sets[${j}].b=this.value"></label><button class="x" aria-label="Remove set" onclick="cur.ex[${i}].sets.splice(${j},1);R.log()">${X}</button></div>`).join('')}
<button class="s" style="margin-top:8px" onclick="addSet(${i})">Add set</button></div>`).join('')}
<div class="card"><label>How it felt</label><div class="seg" role="group" aria-label="How it felt, 1 rough to 5 great">${[1,2,3,4,5].map(n=>`<button class="${n==s.feel?'':'s'}" onclick="cur.feel=${n};R.log()">${n}</button>`).join('')}</div>
<p class="m" style="margin-top:8px">1 is rough, 5 is great.</p>
<label for="notes">Notes</label><textarea id="notes" oninput="cur.notes=this.value">${esc(s.notes)}</textarea></div>
<button onclick="finish()">${editId?'Update workout':'Save workout'}</button>${editId?'<button class="s" style="margin-top:8px" onclick="cur=null;editId=null;R.log()">Cancel edit</button>':''}`;fillPicker()};
function loadCatalog(){return fetch('exercises.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{if(j&&Array.isArray(j.exercises))CATALOG=j}).catch(()=>{})}
function fillPicker(){const sel=$('#expick');if(!sel)return;const q=pickQ.trim().toLowerCase();
const list=CATALOG.exercises||[],names=new Set(list.map(e=>String(e.name).toLowerCase()));
const cats=(CATALOG.categories&&CATALOG.categories.length?CATALOG.categories:['Chest','Back','Shoulders','Arms','Legs','Core','Cardio','Mobility']);
const hit=e=>!q||(e.name+' '+(e.equipment||'')+' '+(e.category||'')).toLowerCase().includes(q);
const groups=[];let shown=0;
cats.forEach(cat=>{const items=list.filter(e=>e.category===cat&&(!pickBeg||e.beginnerFriendly===true)&&hit(e));if(!items.length)return;shown+=items.length;
groups.push(`<optgroup label="${esc(cat)}">${items.map(e=>`<option value="c:${esc(e.id)}">${esc(e.name)} · ${esc(e.equipment||'')}</option>`).join('')}</optgroup>`)});
const known=new Set(cats);const extra=list.filter(e=>!known.has(e.category)&&(!pickBeg||e.beginnerFriendly===true)&&hit(e));
[...new Set(extra.map(e=>e.category))].forEach(cat=>{const items=extra.filter(e=>e.category===cat);shown+=items.length;
groups.push(`<optgroup label="${esc(cat)}">${items.map(e=>`<option value="c:${esc(e.id)}">${esc(e.name)} · ${esc(e.equipment||'')}</option>`).join('')}</optgroup>`)});
const customs=(D.library||[]).filter(e=>e&&e.n&&!names.has(String(e.n).toLowerCase())&&(!q||String(e.n).toLowerCase().includes(q)));
let html='<option value="">Choose an exercise</option>'+groups.join('');
if(customs.length){shown+=customs.length;html+=`<optgroup label="My exercises">${customs.map(e=>`<option value="u:${esc(encodeURIComponent(e.n))}">${esc(e.n)} · Custom</option>`).join('')}</optgroup>`}
if(!shown)html+='<option value="" disabled>No matches</option>';
sel.innerHTML=html;const c=$('#excount');if(c)c.textContent=list.length?(shown?shown+' exercise'+(shown===1?'':'s'):'No matches'):'Exercise list did not load. Custom exercises still work.'}
function pickEx(){const v=$('#expick').value;if(!v)return;let name,cardio;
if(v.startsWith('c:')){const ex=(CATALOG.exercises||[]).find(e=>e.id===v.slice(2));if(!ex)return;name=ex.name;cardio=ex.type==='cardio'}
else if(v.startsWith('u:')){let n;try{n=decodeURIComponent(v.slice(2))}catch(err){return}const lib=(D.library||[]).find(e=>e.n===n);if(!lib)return;name=lib.n;cardio=lib.k==='cardio'}
else return;cur=cur||blank();cur.ex.push({n:name,c:cardio,sets:[{a:'',b:''}]});R.log();
const inputs=[...document.querySelectorAll('#app .set input')];if(inputs.length>=2){inputs[inputs.length-2].focus({preventScroll:true});inputs[inputs.length-2].closest('.card').scrollIntoView({block:'center'})}}
function addSet(i){const p=cur.ex[i].sets.at(-1)||{};cur.ex[i].sets.push({a:p.a||'',b:p.b||''});R.log()}
function finish(){if(!cur.ex.length&&!cur.notes){alert('Add an exercise or a note first.');return}
cur.ex.forEach(e=>e.sets=e.sets.filter(t=>t.a!==''||t.b!==''));
cur.u=Date.now();if(editId)D.sessions=D.sessions.map(x=>x.id==editId?cur:x);else D.sessions.push(cur);save();cur=null;editId=null;alert('Saved!');go('hist')}
const vol=e=>e.c?0:e.sets.reduce((s,t)=>s+(+t.a||0)*(+t.b||0),0);
const setChips=e=>e.sets.map(t=>`<span class="chip">${e.c?`${t.a||0} min${t.b?' · '+t.b+' mi':''}`:`${t.a} × ${t.b||0} lb`}</span>`).join('');
R.hist=()=>{const L=[...D.sessions].sort((a,b)=>b.date.localeCompare(a.date));$('#app').innerHTML=L.length?L.map(s=>`<div class="card"><div class="exhead"><div><h3>${s.date}</h3><p class="m" style="margin-top:2px;text-transform:capitalize">${esc(s.type)}</p></div><span class="pill">Feel ${s.feel}/5</span></div>
<div class="exlist">${s.ex.map(e=>`<div class="exrow"><div class="exname">${esc(e.n)}</div><div class="chips">${setChips(e)}</div></div>`).join('')}</div>
${s.notes?`<p class="m" style="margin-top:8px">${esc(s.notes)}</p>`:''}<div class="row" style="margin-top:14px"><button class="s" onclick="edit(${s.id})">Edit</button><button class="x" onclick="del(${s.id})">Delete</button></div></div>`).join(''):'<div class="card"><h3>No workouts yet</h3><p class="m">Log your first one from the Log tab.</p></div>'};
function edit(id){cur=JSON.parse(JSON.stringify(D.sessions.find(s=>s.id==id)));editId=id;go('log')}
function del(id){if(confirm('Delete this workout?')){D.sessions=D.sessions.filter(s=>s.id!=id);tomb('s',id);save();R.hist()}}
function prs(){const P={};D.sessions.forEach(s=>s.ex.forEach(e=>{const p=P[e.n]=P[e.n]||{c:e.c,max:0,reps:0,vol:0,min:0,mi:0};
e.sets.forEach(t=>{const a=+t.a||0,b=+t.b||0;if(e.c){p.min=Math.max(p.min,a);p.mi=Math.max(p.mi,b)}else{p.max=Math.max(p.max,b);p.reps=Math.max(p.reps,a)}});p.vol=Math.max(p.vol,vol(e))}));return P}
R.lib=()=>{const P=prs();$('#app').innerHTML=`<div class="card"><h3>Add exercise</h3><label for="nn">Name</label><input id="nn" placeholder="Exercise name"><label for="nk">Tracking</label><select id="nk"><option value="strength">Strength (reps × weight)</option><option value="cardio">Cardio (minutes / miles)</option></select><button style="margin-top:14px" onclick="addLib()">Add to library</button></div>
<div class="card list">${D.library.map((e,i)=>{const p=P[e.n];const detail=e.k+(p?(p.c?` · PR ${p.min} min, ${p.mi} mi`:` · PR ${p.max} lb, ${p.reps} reps, ${p.vol} lb volume`):' · no PRs yet');return`<div class="librow"><div class="grow"><div class="exname">${esc(e.n)}</div><div class="m">${esc(detail)}</div></div><button class="x" onclick="if(confirm('Remove from library?')){tomb('l',String(D.library[${i}].n).toLowerCase());D.library.splice(${i},1);save();R.lib()}">Remove</button></div>`}).join('')}</div>`};
function addLib(){const n=$('#nn').value.trim();if(!n)return;if(D.library.some(e=>e.n.toLowerCase()==n.toLowerCase())){alert('Already in library');return}D.library.push({n,k:$('#nk').value,a:Date.now()});save();R.lib()}
function chart(id,labels,vals,unit){const c=document.getElementById(id),r=devicePixelRatio||1,W=c.clientWidth,H=200;c.width=W*r;c.height=H*r;const x=c.getContext('2d');x.scale(r,r);
x.fillStyle='#c8bba6';x.font='12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';if(!vals.length){x.fillText('No data yet',10,100);return}
const mx=Math.max(...vals)||1,mn=unit=='lb'?Math.min(...vals)*0.98:0,n=vals.length,bw=(W-40)/n;
vals.forEach((v,i)=>{const h=(v-mn)/(mx-mn||1)*(H-50)+4;x.fillStyle='#8a9a58';const rx=30+i*bw+2,ry=H-24-h,rw=Math.max(bw-6,3);if(x.roundRect){x.beginPath();x.roundRect(rx,ry,rw,h,4);x.fill()}else x.fillRect(rx,ry,rw,h);
if(n<=12){x.fillStyle='#c8bba6';x.fillText(labels[i],30+i*bw+2,H-8)}});x.fillStyle='#f4f0e8';x.fillText(`max ${Math.round(mx)} ${unit}`,30,16)}
function wk(d){const t=new Date(d+'T12:00');t.setDate(t.getDate()-((t.getDay()+6)%7));return t.toLocaleDateString('en-CA')}
R.prog=()=>{const names=[...new Set(D.sessions.flatMap(s=>s.ex.filter(e=>!e.c).map(e=>e.n)))];
$('#app').innerHTML=`<div class="card"><h3>Workouts per week</h3><canvas id="c1"></canvas></div><div class="card"><h3>Volume per exercise</h3><select id="ps" onchange="drawV()">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select><canvas id="c2"></canvas><p class="m" style="margin-top:8px">Volume is reps × weight, summed per session.</p></div>`;
const W={};D.sessions.forEach(s=>{const k=wk(s.date);W[k]=(W[k]||0)+1});const ks=Object.keys(W).sort().slice(-12);chart('c1',ks.map(k=>k.slice(5)),ks.map(k=>W[k]),'workouts');drawV()};
function drawV(){const n=($('#ps')||{}).value;const pts=D.sessions.filter(s=>s.ex.some(e=>e.n==n)).sort((a,b)=>a.date.localeCompare(b.date)).slice(-12).map(s=>[s.date.slice(5),s.ex.filter(e=>e.n==n).reduce((t,e)=>t+vol(e),0)]);chart('c2',pts.map(p=>p[0]),pts.map(p=>p[1]),'lb')}
R.wt=()=>{const L=[...D.weights].sort((a,b)=>a.date.localeCompare(b.date));const f=L[0],l=L.at(-1);
$('#app').innerHTML=`<div class="card"><div class="row"><div><label for="wd">Date</label><input id="wd" type="date" value="${today()}"></div><div><label for="wv">Weight (lb)</label><input id="wv" inputmode="decimal"></div></div><button style="margin-top:14px" onclick="addW()">Log weight</button></div>
${L.length>1?`<div class="card"><p class="stat">${(l.w-f.w>0?'+':'')+(l.w-f.w).toFixed(1)} lb</p><p class="m" style="margin-top:4px">since ${f.date}</p></div>`:''}
<div class="card"><h3>Trend</h3><canvas id="c3"></canvas></div>${L.length?`<div class="card list">${[...L].reverse().map(x=>`<div class="wrow"><span class="grow">${x.date}</span><b>${x.w} lb</b><button class="x" onclick="D.weights=D.weights.filter(y=>y.id!=${x.id});tomb('w',${x.id});save();R.wt()">Remove</button></div>`).join('')}</div>`:''}`;
const s=L.slice(-20);chart('c3',s.map(x=>x.date.slice(5)),s.map(x=>x.w),'lb')};
function addW(){const w=parseFloat($('#wv').value);if(!w)return;D.weights.push({id:Date.now(),date:$('#wd').value,w,u:Date.now()});save();R.wt()}
R.more=()=>{$('#app').innerHTML=acct()+`<div class="card"><h3>Backup</h3><p class="m">${window.POS&&POS.user?'Synced privately to your account and kept on this device for offline use. Export now and then for an extra copy.':'Your data lives only on this device until you sign in. Export regularly.'}</p><button style="margin-top:14px" onclick="exp()">Export workouts JSON</button><button class="s" style="margin-top:8px" onclick="exportAll()">Export all Personal OS data</button><label for="imp">Import JSON (replaces current data)</label><input id="imp" type="file" accept=".json,application/json" onchange="imp(this.files[0])"></div>
<div class="card"><p class="stat" style="font-size:22px">${D.sessions.length} · ${D.library.length} · ${D.weights.length}</p><p class="m" style="margin-top:4px">workouts, exercises, weigh-ins</p></div>`};
function exp(){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`workout-journal-${today()}.json`;a.click()}
function imp(f){if(!f)return;f.text().then(t=>{const j=JSON.parse(t);if(!j.sessions||!j.library)throw 0;if(confirm('Replace all current data? This also replaces your cloud copy.')){D={weights:[],...j};localStorage.setItem(K,JSON.stringify(D));window.POS&&POS.schedule('workout',{replace:true});alert('Imported');go('hist')}}).catch(()=>alert('Not a valid backup file'))}
/* ---- Cloud sync: workout module adapter (see sync.js for the shared core) ---- */
function mergeById(L,Rm,del){const m=new Map();(Rm||[]).forEach(x=>x&&m.set(String(x.id),x));(L||[]).forEach(x=>{if(!x)return;const k=String(x.id),o=m.get(k);if(!o||(x.u||0)>=(o.u||0))m.set(k,x)});
const order=[...(Rm||[]).map(x=>x&&String(x.id)),...(L||[]).map(x=>x&&String(x.id))];return[...new Set(order)].filter(k=>k&&m.has(k)&&!(del&&del[k]&&del[k]>=(m.get(k).u||0))).map(k=>m.get(k))}
function mergeDel(a,b){const o={};['s','w','l'].forEach(t=>{o[t]={...((b||{})[t]||{})};Object.entries((a||{})[t]||{}).forEach(([k,v])=>{o[t][k]=Math.max(v,o[t][k]||0)})});return o}
function mergeWJ(L,Rm){L=L||{};Rm=Rm||{};const del=mergeDel(L._del,Rm._del),lib=new Map();
[...(Rm.library||[]),...(L.library||[])].forEach(e=>{if(!e||!e.n)return;const k=String(e.n).toLowerCase();if(!lib.has(k)||(e.a||0)>(lib.get(k).a||0))lib.set(k,e)});
const library=[...lib].filter(([k,e])=>!(del.l[k]&&del.l[k]>=(e.a||0))).map(([,e])=>e);
return{...Rm,...L,sessions:mergeById(L.sessions,Rm.sessions,del.s),weights:mergeById(L.weights,Rm.weights,del.w),library,_del:del}}
if(window.POS)POS.register({name:'workout',load:()=>D,store:d=>{D=d;localStorage.setItem(K,JSON.stringify(D))},merge:mergeWJ,
onRemote:()=>{if(OS.app!=='workout'){if(OS.app==='home'||OS.app==='week')OS.refresh();return}if(tab==='log'){fillPicker()}else R[tab]()}});
OS.reg('workout',{title:'Workouts',brand:'Workout Journal',short:'Workouts',quick:true,icon:OS.ICON.dumbbell,tabs:tabs.map(([k,l])=>[k,l,I[k]]),titles:{log:'Log Workout'},
render(v){tab=v;R[v]()},
tile(){const ws=OS.weekStart(),n=D.sessions.filter(s=>s.date>=ws).length,last=[...D.sessions].sort((a,b)=>b.date.localeCompare(a.date))[0];return{stat:n+' this week',sub:last?'Last '+OS.fmtDay(last.date):'Nothing logged yet'}}});
loadCatalog().then(()=>{if(OS.app==='workout'&&tab==='log'&&$('#expick'))fillPicker()});
if('serviceWorker'in navigator){navigator.serviceWorker.addEventListener('controllerchange',()=>{if(sessionStorage.getItem('wj-sw-reload'))return;sessionStorage.setItem('wj-sw-reload','1');location.reload()});navigator.serviceWorker.register('sw.js')}
